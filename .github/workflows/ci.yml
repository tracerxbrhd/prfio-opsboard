name: Verify OpsBoard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opsboard
          POSTGRES_USER: opsboard
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opsboard:ci-only-password@localhost:5432/opsboard
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check backend && ruff format --check backend
      - run: python backend/manage.py check && python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput && python backend/manage.py seed_demo
      - run: python backend/manage.py test operations
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm ci && npm run lint && npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py seed_demo
          python backend/manage.py runserver 127.0.0.1:8101 --noreload > /tmp/opsboard-api.log 2>&1 &
          npm --prefix frontend run dev > /tmp/opsboard-web.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5103/api/health/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:5103/api/health/
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            docs/screenshots/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet && docker compose build
